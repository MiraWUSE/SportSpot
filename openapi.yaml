                - id: 33333333-3333-4333-8333-333333333333
                  name: Баскетбольная площадка
                  status: pending
                  sport_type: basketball
                  latitude: 56.32
                  longitude: 44.0
        '400':
          description: Некорректные параметры или тело запроса
          content:
            application/json:
              schema:
