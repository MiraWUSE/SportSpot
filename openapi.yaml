          in: query
          required: false
          description: Список полей PostgREST
          schema:
            type: string
          example: id,name,sport_type
        - name: limit
          in: query
          required: false
          description: Максимальное число строк
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 20
        - name: offset
          in: query
          required: false
          description: Число пропущенных строк
          schema:
            type: integer
            minimum: 0
          example: 0
      responses:
