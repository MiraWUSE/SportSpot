openapi: 3.0.3
info:
  title: SportSpot — API серверной части
  version: 1.0.0
  description: >-
servers:
  - url: https://{projectRef}.supabase.co
    description: Supabase project URL
    variables:
      projectRef:
        default: tnqkaamvvxwsimfydurg
        description: Идентификатор проекта Supabase
tags:
  - name: Поиск
    description: Поиск площадок во внешнем источнике
  - name: Площадки
    description: Сохранённые площадки
  - name: Отзывы
    description: Отзывы пользователей
  - name: Избранное
    description: Избранные площадки
  - name: Предложения
    description: Предложения новых площадок
  - name: Модерация
    description: Модерация предложений
paths:
  /functions/v1/search-sports-spots-v1:
    get:
      tags:
        - Поиск
      summary: Поиск спортивных площадок через Overpass.ch
      operationId: searchSpots
      security: []
      description: >-
        Опубликованная публичная Supabase Edge Function (Verify JWT отключён).
        Для успешного запроса обязательны параметры lat и lon. Параметры radius
        и sport необязательны. Неизвестные и повторяющиеся параметры запрещены.
        Результаты кешируются на один час. Ответ может содержать до 100 объектов
        OpenStreetMap. Постраничной навигации у этой функции нет.
        Поиск зависит от доступности внешнего Overpass.ch и ограничений вызовов.
      parameters:
        - name: lat
          in: query
          required: true
          description: Широта, число в диапазоне от -90 до 90 (максимум 6 десятичных знаков)
          schema:
            type: number
            minimum: -90
            maximum: 90
          example: 56.3269
        - name: lon
          in: query
          required: true
          description: Долгота, число в диапазоне от -180 до 180 (максимум 6 десятичных знаков)
          schema:
            type: number
            minimum: -180
            maximum: 180
          example: 44.0059
        - name: radius
          in: query
          required: false
          description: >-
            Точный радиус поиска в метрах: значение передаётся в Overpass
            без округления. Координаты также используются без округления.
          schema:
            type: integer
            minimum: 100
            maximum: 3000
            default: 1000
          example: 1000
        - name: sport
          in: query
          required: false
          description: Вид спорта
          schema:
            type: string
            enum: [all, soccer, basketball, volleyball, tennis, fitness]
            default: all
          example: basketball
      responses:
        '200':
          description: Результаты поиска спортивных площадок
          headers:
            X-Request-Id:
              description: Идентификатор запроса (включая ответы из кеша)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotSearchResult'
              example:
                spots:
                  - id: osm:node:12345
                    source: osm
                    osm_type: node
                    osm_id: 12345
                    name: Спортивная площадка
                    sport_type: basketball
                    latitude: 56.3269
                    longitude: 44.0059
                    address: null
                    surface: asphalt
                    lighting: null
                    equipment: null
                count: 1
                source: Overpass API
                attribution: © OpenStreetMap contributors
                cache: miss
        '400':
          description: Некорректные, неизвестные или повторяющиеся параметры
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionError'
              example:
                error:
                  code: INVALID_REQUEST
                  message: Invalid coordinates, radius or sport
                  request_id: 4c59e8fc-1342-4f15-aa3f-4ecc97f0d1c2
        '405':
          description: Разрешён только метод GET
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionError'
              example:
                error:
                  code: METHOD_NOT_ALLOWED
                  message: Use GET
                  request_id: 4c59e8fc-1342-4f15-aa3f-4ecc97f0d1c2
        '429':
          description: Превышен лимит запросов
          headers:
            Retry-After:
              description: Время ожидания в секундах
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionError'
              example:
                error:
                  code: RATE_LIMITED
                  message: Too many requests
                  request_id: 4c59e8fc-1342-4f15-aa3f-4ecc97f0d1c2
        '500':
          description: Ошибка конфигурации сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionError'
              example:
                error:
                  code: SERVER_CONFIG_ERROR
                  message: Overpass API key is not configured
                  request_id: 4c59e8fc-1342-4f15-aa3f-4ecc97f0d1c2
        '503':
          description: Внешний Overpass API или серверные зависимости временно недоступны
          headers:
            Retry-After:
              description: Повторить запрос через заданное число секунд
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionError'
              example:
                error:
                  code: UPSTREAM_UNAVAILABLE
                  message: Sports data providers temporarily unavailable
                  request_id: 4c59e8fc-1342-4f15-aa3f-4ecc97f0d1c2
  /rest/v1/spots:
    get:
      tags:
        - Площадки
      summary: Получение сохранённых площадок
      operationId: listSpots
      security:
        - publishableKey: []
      description: Список площадок. Для одной площадки используйте id=eq.osm%3Anode%3A12345. PostgREST может вернуть
        200 с [] при отсутствии совпадений.
      parameters:
        - name: select
          in: query
          required: false
          description: Список полей PostgREST
          schema:
            type: string
          example: id,name,sport_type
        - name: limit
          in: query
          required: false
          description: Максимальное число строк
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 20
        - name: offset
          in: query
          required: false
          description: Число пропущенных строк
          schema:
            type: integer
            minimum: 0
          example: 0
        - name: order
          in: query
          required: false
          description: Сортировка PostgREST
          schema:
            type: string
          example: name.asc
        - name: id
          in: query
          required: false
          description: Фильтр PostgREST по полю id, значение с префиксом eq.
          schema:
            type: string
          example: eq.osm:node:12345
      responses:
        '200':
          description: Список площадок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Spot'
              example:
                - id: osm:node:12345
                  name: Спортивная площадка
                  sport_type: basketball
          headers:
            Content-Range:
              description: Диапазон и (при запросе count) общее число строк
              schema:
                type: string
        '400':
          description: Некорректные параметры или тело запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
  /rest/v1/reviews:
    get:
      tags:
        - Отзывы
      summary: Отзывы о площадке
      operationId: listReviews
      security:
        - publishableKey: []
      description: При фильтрации указывается spot_id=eq.osm%3Anode%3A12345.
      parameters:
        - name: spot_id
          in: query
          required: false
          description: Фильтр PostgREST по полю spot_id, значение с префиксом eq.
          schema:
            type: string
          example: eq.osm:node:12345
        - name: select
          in: query
          required: false
          description: Список полей PostgREST
          schema:
            type: string
          example: id,name,sport_type
        - name: limit
          in: query
          required: false
          description: Максимальное число строк
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 20
        - name: offset
          in: query
          required: false
          description: Число пропущенных строк
          schema:
            type: integer
            minimum: 0
          example: 0
      responses:
        '200':
          description: Список отзывов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
              example:
                - id: 22222222-2222-4222-8222-222222222222
                  spot_id: osm:node:12345
                  rating: 5
                  text: Хорошая площадка
        '400':
          description: Некорректные параметры или тело запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
    post:
      tags:
        - Отзывы
      summary: Добавить отзыв
      operationId: createReview
      security:
        - publishableKey: []
          bearerAuth: []
      description: Автор автоматически задаётся сервером через auth.uid(); повторный отзыв для той же площадки не
        допускается.
      parameters:
        - name: select
          in: query
          required: false
          description: Поля возвращаемой записи
          schema:
            type: string
          example: id,rating,text
        - name: Prefer
          in: header
          required: true
          schema:
            type: string
            enum:
              - return=representation
          description: Чтобы получить сохранённую запись в теле ответа
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewReview'
            example:
              spot_id: osm:node:12345
              rating: 5
              text: Хорошая площадка
      responses:
        '201':
          description: Отзыв создан, возвращается массив из одной записи
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
              example:
                - id: 22222222-2222-4222-8222-222222222222
                  spot_id: osm:node:12345
                  rating: 5
                  text: Хорошая площадка
        '400':
          description: Некорректные параметры или тело запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '409':
          description: Конфликт данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
    patch:
      tags:
        - Отзывы
      summary: Редактировать свой отзыв
      operationId: updateReview
      security:
        - publishableKey: []
          bearerAuth: []
      description: Обязателен фильтр id, RLS разрешает изменение только своего отзыва.
      parameters:
        - name: id
          in: query
          required: true
          description: Фильтр PostgREST по полю id, значение с префиксом eq.
          schema:
            type: string
          example: eq.22222222-2222-4222-8222-222222222222
        - name: Prefer
          in: header
          required: true
          schema:
            type: string
            enum:
              - return=representation
          description: Возвратить изменённую запись
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReview'
            example:
              rating: 4
              text: Хорошая площадка, но слабое освещение
      responses:
        '200':
          description: Массив изменённых отзывов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
              example:
                - id: 22222222-2222-4222-8222-222222222222
                  spot_id: osm:node:12345
                  rating: 4
                  text: Хорошая площадка, но слабое освещение
        '400':
          description: Некорректные параметры или тело запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
    delete:
      tags:
        - Отзывы
      summary: Удалить свой отзыв
      operationId: deleteReview
      security:
        - publishableKey: []
          bearerAuth: []
      description: Обязателен фильтр по id; RLS ограничивает удаление своим отзывом.
      parameters:
        - name: id
          in: query
          required: true
          description: Фильтр PostgREST по полю id, значение с префиксом eq.
          schema:
            type: string
          example: eq.22222222-2222-4222-8222-222222222222
      responses:
        '204':
          description: Удаление выполнено; тело отсутствует
        '400':
          description: Некорректные параметры или тело запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
  /rest/v1/favorites:
