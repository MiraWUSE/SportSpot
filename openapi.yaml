                  latitude: 56.32
                  longitude: 44.0
        '400':
          description: Некорректные параметры или тело запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
    post:
      tags:
        - Предложения
