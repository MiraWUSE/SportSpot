openapi: 3.0.3
info:
  title: SportSpot — API серверной части
  version: 1.0.0
  description: 'Проектная спецификация API SportSpot. Описывает 12 операций Supabase
    REST (PostgREST) и двух Edge Functions. Спецификация фиксирует контракт будущей реализации, а не подтверждает
    доступность сервера. Учётные записи и вход выполняются отдельно через Supabase Auth. Клиент использует только
    publishable/anon ключ, никогда secret/service_role. Для POST/PATCH ниже предусмотрен Prefer: return=representation.
    RLS должна обеспечивать доступ только к собственным записям. Для объектов OSM в spots.id используется формат
    osm:node:12345, для опубликованных пользовательских площадок — community:UUID.'
servers:
  - url: https://{projectRef}.supabase.co
    description: Supabase project URL
    variables:
      projectRef:
        default: your-project-ref
        description: Идентификатор проекта Supabase
tags:
  - name: Поиск
    description: Поиск площадок во внешнем источнике
  - name: Площадки
    description: Сохранённые площадки
  - name: Отзывы
    description: Отзывы пользователей
  - name: Избранное
    description: Избранные площадки
  - name: Предложения
    description: Предложения новых площадок
  - name: Модерация
    description: Модерация предложений
paths:
  /functions/v1/spots-search-v1:
    get:
      tags:
        - Поиск
      summary: Поиск спортивных площадок через Overpass API
      operationId: searchSpots
      security:
        - publishableKey: []
      description: Публичная Edge Function. При реализации настроить доступ по publishable key без пользовательского
        JWT, проверку координат, кеширование, лимиты и пагинацию. Функция ещё не развернута.
      parameters:
        - name: latitude
          in: query
          required: true
          description: Широта
          schema:
            type: number
            minimum: -90
            maximum: 90
          example: 56.32
        - name: longitude
          in: query
          required: true
          description: Долгота
          schema:
            type: number
            minimum: -180
            maximum: 180
          example: 44.0
        - name: radius_m
          in: query
          required: true
          description: Радиус поиска в метрах
          schema:
            type: integer
            minimum: 100
            maximum: 20000
          example: 3000
        - name: sport_type
          in: query
          required: false
          description: Вид спорта
          schema:
            type: string
          example: basketball
        - name: page
          in: query
          required: false
          description: Номер страницы
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: limit
          in: query
          required: false
          description: Количество на странице
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
      responses:
        '200':
          description: Результаты поиска
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotSearchResult'
              example:
                data:
                  - id: osm:node:12345
                    name: Спортивная площадка
                    sport_type: basketball
                    latitude: 56.32
                    longitude: 44.0
                    source: osm
                page: 1
                limit: 20
                has_more: false
        '400':
          description: Некорректные параметры или тело запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionError'
              example:
                code: INVALID_COORDINATES
                message: Некорректные координаты
        '429':
          description: Превышен лимит запросов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionError'
              example:
                code: INVALID_COORDINATES
                message: Некорректные координаты
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionError'
              example:
                code: INVALID_COORDINATES
                message: Некорректные координаты
        '502':
          description: Ошибка внешнего Overpass API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionError'
              example:
                code: INVALID_COORDINATES
                message: Некорректные координаты
  /rest/v1/spots:
    get:
      tags:
        - Площадки
      summary: Получение сохранённых площадок
      operationId: listSpots
      security:
        - publishableKey: []
      description: Список площадок. Для одной площадки используйте id=eq.osm%3Anode%3A12345. PostgREST может вернуть
        200 с [] при отсутствии совпадений.
      parameters:
        - name: select
          in: query
          required: false
          description: Список полей PostgREST
          schema:
            type: string
          example: id,name,sport_type
        - name: limit
          in: query
          required: false
          description: Максимальное число строк
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 20
        - name: offset
          in: query
          required: false
          description: Число пропущенных строк
          schema:
            type: integer
            minimum: 0
          example: 0
        - name: order
          in: query
          required: false
          description: Сортировка PostgREST
          schema:
            type: string
          example: name.asc
        - name: id
          in: query
          required: false
          description: Фильтр PostgREST по полю id, значение с префиксом eq.
          schema:
            type: string
          example: eq.osm:node:12345
      responses:
        '200':
          description: Список площадок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Spot'
              example:
                - id: osm:node:12345
                  name: Спортивная площадка
                  sport_type: basketball
          headers:
            Content-Range:
              description: Диапазон и (при запросе count) общее число строк
              schema:
                type: string
        '400':
          description: Некорректные параметры или тело запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
  /rest/v1/reviews:
    get:
      tags:
        - Отзывы
      summary: Отзывы о площадке
      operationId: listReviews
      security:
        - publishableKey: []
      description: При фильтрации указывается spot_id=eq.osm%3Anode%3A12345.
      parameters:
        - name: spot_id
          in: query
          required: false
          description: Фильтр PostgREST по полю spot_id, значение с префиксом eq.
          schema:
            type: string
          example: eq.osm:node:12345
        - name: select
          in: query
          required: false
          description: Список полей PostgREST
          schema:
            type: string
          example: id,name,sport_type
        - name: limit
          in: query
          required: false
          description: Максимальное число строк
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 20
        - name: offset
          in: query
          required: false
          description: Число пропущенных строк
          schema:
            type: integer
            minimum: 0
          example: 0
      responses:
        '200':
          description: Список отзывов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
              example:
                - id: 22222222-2222-4222-8222-222222222222
                  spot_id: osm:node:12345
                  rating: 5
                  text: Хорошая площадка
        '400':
          description: Некорректные параметры или тело запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
    post:
      tags:
        - Отзывы
      summary: Добавить отзыв
      operationId: createReview
      security:
        - publishableKey: []
          bearerAuth: []
      description: Автор автоматически задаётся сервером через auth.uid(); повторный отзыв для той же площадки не
        допускается.
      parameters:
        - name: select
          in: query
          required: false
          description: Поля возвращаемой записи
          schema:
            type: string
          example: id,rating,text
        - name: Prefer
          in: header
          required: true
          schema:
            type: string
            enum:
              - return=representation
          description: Чтобы получить сохранённую запись в теле ответа
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewReview'
            example:
              spot_id: osm:node:12345
              rating: 5
              text: Хорошая площадка
      responses:
        '201':
          description: Отзыв создан, возвращается массив из одной записи
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
              example:
                - id: 22222222-2222-4222-8222-222222222222
                  spot_id: osm:node:12345
                  rating: 5
                  text: Хорошая площадка
        '400':
          description: Некорректные параметры или тело запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '409':
          description: Конфликт данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
    patch:
      tags:
        - Отзывы
      summary: Редактировать свой отзыв
      operationId: updateReview
      security:
        - publishableKey: []
          bearerAuth: []
      description: Обязателен фильтр id, RLS разрешает изменение только своего отзыва.
      parameters:
        - name: id
          in: query
          required: true
          description: Фильтр PostgREST по полю id, значение с префиксом eq.
          schema:
            type: string
          example: eq.22222222-2222-4222-8222-222222222222
        - name: Prefer
          in: header
          required: true
          schema:
            type: string
            enum:
              - return=representation
          description: Возвратить изменённую запись
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReview'
            example:
              rating: 4
              text: Хорошая площадка, но слабое освещение
      responses:
        '200':
          description: Массив изменённых отзывов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
              example:
                - id: 22222222-2222-4222-8222-222222222222
                  spot_id: osm:node:12345
                  rating: 4
                  text: Хорошая площадка, но слабое освещение
        '400':
          description: Некорректные параметры или тело запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
    delete:
      tags:
        - Отзывы
      summary: Удалить свой отзыв
      operationId: deleteReview
      security:
        - publishableKey: []
          bearerAuth: []
      description: Обязателен фильтр по id; RLS ограничивает удаление своим отзывом.
      parameters:
        - name: id
          in: query
          required: true
          description: Фильтр PostgREST по полю id, значение с префиксом eq.
          schema:
            type: string
          example: eq.22222222-2222-4222-8222-222222222222
      responses:
        '204':
          description: Удаление выполнено; тело отсутствует
        '400':
          description: Некорректные параметры или тело запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
  /rest/v1/favorites:
    get:
      tags:
        - Избранное
      summary: Избранные площадки пользователя
      operationId: listFavorites
      security:
        - publishableKey: []
          bearerAuth: []
      description: RLS возвращает только избранное текущего пользователя.
      parameters:
        - name: select
          in: query
          required: false
          description: Список полей PostgREST
          schema:
            type: string
          example: id,name,sport_type
        - name: limit
          in: query
          required: false
          description: Максимальное число строк
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 20
        - name: offset
          in: query
          required: false
          description: Число пропущенных строк
          schema:
            type: integer
            minimum: 0
          example: 0
      responses:
        '200':
          description: Избранное пользователя
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Favorite'
              example:
                - spot_id: osm:node:12345
                  created_at: '2026-11-02T10:00:00Z'
        '400':
          description: Некорректные параметры или тело запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
    post:
      tags:
        - Избранное
      summary: Добавить площадку в избранное
      operationId: addFavorite
      security:
        - publishableKey: []
          bearerAuth: []
      description: user_id назначается сервером; пара (user_id, spot_id) уникальна.
      parameters:
        - name: Prefer
          in: header
          required: true
          schema:
            type: string
            enum:
              - return=representation
          description: Получить созданную запись
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewFavorite'
            example:
              spot_id: osm:node:12345
      responses:
        '201':
          description: Площадка добавлена
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Favorite'
              example:
                - spot_id: osm:node:12345
        '400':
          description: Некорректные параметры или тело запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
