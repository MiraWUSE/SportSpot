      operationId: removeFavorite
      security:
        - publishableKey: []
          bearerAuth: []
      description: Только для текущего пользователя (RLS).
      parameters:
        - name: spot_id
          in: query
          required: true
          description: Фильтр PostgREST по полю spot_id, значение с префиксом eq.
          schema:
            type: string
          example: eq.osm:node:12345
      responses:
        '204':
          description: Удаление выполнено; тело отсутствует
        '400':
          description: Некорректные параметры или тело запроса
