          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
  /rest/v1/spot_proposals:
    get:
      tags:
        - Предложения
      summary: Получить предложения площадок
      operationId: listSpotProposals
      security:
        - publishableKey: []
          bearerAuth: []
      description: 'RLS: пользователь видит свои предложения, модератор — доступные ему предложения.'
      parameters:
        - name: select
          in: query
          required: false
          description: Список полей PostgREST
          schema:
            type: string
          example: id,name,sport_type
        - name: limit
          in: query
          required: false
          description: Максимальное число строк
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 20
        - name: offset
          in: query
          required: false
          description: Число пропущенных строк
          schema:
            type: integer
            minimum: 0
          example: 0
        - name: status
          in: query
          required: false
          description: Фильтр PostgREST по полю status, значение с префиксом eq.
          schema:
            type: string
          example: eq.pending
      responses:
        '200':
          description: Список предложений
          content:
