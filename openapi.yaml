            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
              example:
                code: '23505'
                message: duplicate key value violates unique constraint
                details: null
                hint: null
    delete:
      tags:
        - Избранное
      summary: Убрать площадку из избранного
      operationId: removeFavorite
      security:
        - publishableKey: []
          bearerAuth: []
      description: Только для текущего пользователя (RLS).
      parameters:
        - name: spot_id
          in: query
          required: true
          description: Фильтр PostgREST по полю spot_id, значение с префиксом eq.
          schema:
            type: string
          example: eq.osm:node:12345
      responses:
        '204':
          description: Удаление выполнено; тело отсутствует
        '400':
          description: Некорректные параметры или тело запроса
