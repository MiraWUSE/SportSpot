  /functions/v1/moderate-spot-proposal-v1:
    post:
      tags:
        - Модерация
      summary: Одобрение или отклонение предложения площадки
      operationId: moderateSpotProposal
      security:
        - publishableKey: []
          bearerAuth: []
      description: >-
        Защищённая Edge Function (Verify JWT включён). Требуются JWT пользователя
        и роль moderator. Сервер проверяет токен, роль из profiles и выполняет
        атомарную RPC-модерацию. Ошибки, сформированные кодом функции, имеют общий формат
        {error: {code, message, request_id}}.
        Внимание: ошибки, сформированные шлюзом Supabase до запуска функции,
        могут иметь другой формат.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationRequest'
            example:
              proposal_id: 33333333-3333-4333-8333-333333333333
              decision: approved
      responses:
        '200':
          description: Решение успешно применено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationResponse'
              example:
                proposal_id: 33333333-3333-4333-8333-333333333333
                status: approved
                spot_id: community:33333333-3333-4333-8333-333333333333
        '400':
          description: Неверное JSON-тело или данные запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionError'
              example:
                error:
                  code: INVALID_REQUEST
                  message: Invalid proposal, decision, or rejection reason
                  request_id: 4c59e8fc-1342-4f15-aa3f-4ecc97f0d1c2
        '401':
          description: Отсутствует или неверен JWT; шлюз Supabase может вернуть свой формат
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionError'
              example:
                error:
                  code: UNAUTHORIZED
                  message: User access token required
                  request_id: 4c59e8fc-1342-4f15-aa3f-4ecc97f0d1c2
        '403':
          description: Пользователь не имеет прав модератора
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionError'
              example:
                error:
                  code: FORBIDDEN
                  message: Moderator role required
                  request_id: 4c59e8fc-1342-4f15-aa3f-4ecc97f0d1c2
        '404':
          description: Предложение площадки не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionError'
              example:
                error:
                  code: PROPOSAL_NOT_FOUND
                  message: Proposal does not exist
                  request_id: 4c59e8fc-1342-4f15-aa3f-4ecc97f0d1c2
        '405':
          description: Разрешён только метод POST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionError'
              example:
                error:
                  code: METHOD_NOT_ALLOWED
                  message: Use POST
                  request_id: 4c59e8fc-1342-4f15-aa3f-4ecc97f0d1c2
        '409':
          description: Заявка уже обработана или обнаружен конфликт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionError'
              example:
                error:
                  code: PROPOSAL_ALREADY_REVIEWED
                  message: Proposal is already reviewed
                  request_id: 4c59e8fc-1342-4f15-aa3f-4ecc97f0d1c2
        '500':
          description: Ошибка внутренней логики/конфигурации сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionError'
              example:
                error:
                  code: SERVER_ERROR
                  message: Moderation failed
                  request_id: 4c59e8fc-1342-4f15-aa3f-4ecc97f0d1c2
components:
  securitySchemes:
    publishableKey:
      type: apiKey
      in: header
      name: apikey
      description: Публичный ключ Supabase (sb_publishable_... или legacy anon). Не использовать secret/service_role.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token пользователя, полученный через Supabase Auth.
  schemas:
    Spot:
      type: object
      description: Площадка, сохранённая в PostgreSQL
      properties:
        id:
          type: string
          description: 'SpotId: osm:TYPE:OSM_ID либо community:UUID'
          example: osm:node:12345
        name:
          type: string
          example: Спортивная площадка
        sport_type:
          type: string
          example: basketball
        latitude:
          type: number
          example: 56.32
          minimum: -90
          maximum: 90
        longitude:
          type: number
          example: 44.0
          minimum: -180
          maximum: 180
        address:
          type: string
          example: Нижний Новгород
          nullable: true
        surface:
          type: string
          example: asphalt
          nullable: true
        lighting:
          type: boolean
          description: null — неизвестно
          nullable: true
        equipment:
          type: string
          nullable: true
        source:
          type: string
          example: osm
          enum:
            - osm
            - community
        osm_type:
          type: string
          nullable: true
          enum:
            - node
            - way
            - relation
        osm_id:
          type: integer
          format: int64
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - sport_type
    Review:
      type: object
      properties:
        id:
          type: string
          example: 22222222-2222-4222-8222-222222222222
          format: uuid
        user_id:
          type: string
          format: uuid
        spot_id:
          type: string
          example: osm:node:12345
        rating:
          type: integer
          example: 5
          minimum: 1
          maximum: 5
        text:
          type: string
          example: Хорошая площадка
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - spot_id
        - rating
        - text
    NewReview:
      type: object
      required:
        - spot_id
        - rating
        - text
      properties:
        spot_id:
          type: string
          example: osm:node:12345
        rating:
          type: integer
          example: 5
          minimum: 1
          maximum: 5
        text:
          type: string
          example: Хорошая площадка
      additionalProperties: false
      description: user_id назначается базой по auth.uid() и не передаётся клиентом.
    UpdateReview:
      type: object
      minProperties: 1
      properties:
        rating:
          type: integer
          example: 4
          minimum: 1
          maximum: 5
        text:
          type: string
          example: Хорошая площадка, но слабое освещение
      additionalProperties: false
    Favorite:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        spot_id:
          type: string
          example: osm:node:12345
        created_at:
          type: string
          example: '2026-11-02T10:00:00Z'
          format: date-time
      required:
        - spot_id
    NewFavorite:
      type: object
      properties:
        spot_id:
          type: string
          example: osm:node:12345
      required:
        - spot_id
      additionalProperties: false
      description: user_id берётся из auth.uid()
    SpotProposal:
      type: object
      properties:
        id:
          type: string
          example: 33333333-3333-4333-8333-333333333333
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
          example: Баскетбольная площадка
        sport_type:
          type: string
          example: basketball
        latitude:
          type: number
          example: 56.32
          minimum: -90
          maximum: 90
        longitude:
          type: number
          example: 44.0
          minimum: -180
          maximum: 180
        address:
          type: string
          nullable: true
        surface:
          type: string
          nullable: true
        lighting:
          type: boolean
          nullable: true
        equipment:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        status:
          type: string
          example: pending
          enum:
            - pending
            - approved
            - rejected
        reject_reason:
          type: string
          nullable: true
        moderator_id:
          type: string
          format: uuid
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - sport_type
        - latitude
        - longitude
        - status
    NewSpotProposal:
      type: object
      required:
        - name
        - sport_type
        - latitude
        - longitude
      additionalProperties: false
      properties:
        name:
          type: string
          example: Баскетбольная площадка
          minLength: 1
        sport_type:
          type: string
          example: basketball
        latitude:
          type: number
          example: 56.32
          minimum: -90
          maximum: 90
        longitude:
          type: number
          example: 44.0
          minimum: -180
          maximum: 180
        address:
          type: string
          nullable: true
        surface:
          type: string
          nullable: true
        lighting:
          type: boolean
          nullable: true
        equipment:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
      description: user_id берётся из auth.uid(), status по умолчанию pending; клиент не может указывать решение
        модератора.
    ModerationRequest:
      type: object
      required:
        - proposal_id
        - decision
      additionalProperties: false
      properties:
        proposal_id:
          type: string
          example: 33333333-3333-4333-8333-333333333333
          format: uuid
        decision:
          type: string
          example: approved
          enum:
            - approved
            - rejected
        reason:
          type: string
          description: Обязателен для rejected; проверяется в Edge Function.
    ModerationResponse:
      type: object
      required:
        - proposal_id
        - status
      properties:
        proposal_id:
          type: string
          example: 33333333-3333-4333-8333-333333333333
          format: uuid
        status:
          type: string
          example: approved
          enum:
            - approved
            - rejected
        spot_id:
          type: string
          description: Присутствует только после одобрения
          example: community:44444444-4444-4444-8444-444444444444
          nullable: true
        reject_reason:
          type: string
          nullable: true
    SearchSpot:
      type: object
      description: Объект спортивной площадки, нормализованный из Overpass API
      required:
        - id
        - source
        - osm_type
        - osm_id
        - name
        - sport_type
        - latitude
        - longitude
        - address
        - surface
        - lighting
        - equipment
      properties:
        id:
          type: string
          example: osm:node:12345
        source:
          type: string
          enum: [osm]
        osm_type:
          type: string
          enum: [node, way, relation]
        osm_id:
          type: integer
          format: int64
          example: 12345
        name:
          type: string
          example: Спортивная площадка
        sport_type:
          type: string
          example: basketball
        latitude:
          type: number
          example: 56.3269
        longitude:
          type: number
          example: 44.0059
        address:
          type: string
          nullable: true
        surface:
          type: string
          nullable: true
        lighting:
          type: boolean
          nullable: true
        equipment:
          type: string
          nullable: true
    SpotSearchResult:
      type: object
      required:
        - spots
        - count
        - source
        - attribution
        - cache
      properties:
        spots:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SearchSpot'
        count:
          type: integer
          minimum: 0
          maximum: 100
          example: 1
        source:
          type: string
          enum: [Overpass API]
        attribution:
          type: string
          example: © OpenStreetMap contributors
        cache:
          type: string
          enum: [hit, miss]
          example: miss
    RestError:
      type: object
      properties:
        code:
          type: string
          example: '23505'
        message:
          type: string
          example: duplicate key value violates unique constraint
        details:
          type: string
          nullable: true
        hint:
          type: string
          nullable: true
      required:
        - code
        - message
    FunctionError:
      type: object
      description: Ошибка, сформированная кодом Edge Function SportSpot
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - request_id
          properties:
            code:
              type: string
              example: INVALID_REQUEST
            message:
              type: string
              example: Invalid coordinates, radius or sport
            request_id:
              type: string
              format: uuid
              example: 4c59e8fc-1342-4f15-aa3f-4ecc97f0d1c2
