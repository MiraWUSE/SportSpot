components:
  securitySchemes:
    publishableKey:
      type: apiKey
      in: header
      name: apikey
      description: Публичный ключ Supabase (sb_publishable_... или legacy anon). Не использовать secret/service_role.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token пользователя, полученный через Supabase Auth.
  schemas:
    Spot:
      type: object
      description: Площадка, сохранённая в PostgreSQL
      properties:
        id:
          type: string
          description: 'SpotId: osm:TYPE:OSM_ID либо community:UUID'
          example: osm:node:12345
        name:
          type: string
          example: Спортивная площадка
        sport_type:
          type: string
          example: basketball
        latitude:
          type: number
          example: 56.32
          minimum: -90
          maximum: 90
        longitude:
          type: number
          example: 44.0
          minimum: -180
          maximum: 180
        address:
          type: string
          example: Нижний Новгород
          nullable: true
        surface:
          type: string
          example: asphalt
          nullable: true
        lighting:
          type: boolean
          description: null — неизвестно
          nullable: true
        equipment:
          type: string
          nullable: true
        source:
          type: string
          example: osm
          enum:
            - osm
            - community
        osm_type:
          type: string
          nullable: true
          enum:
            - node
            - way
            - relation
        osm_id:
          type: integer
          format: int64
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - sport_type
    Review:
      type: object
      properties:
        id:
          type: string
          example: 22222222-2222-4222-8222-222222222222
          format: uuid
        user_id:
          type: string
          format: uuid
        spot_id:
          type: string
          example: osm:node:12345
        rating:
          type: integer
          example: 5
          minimum: 1
          maximum: 5
        text:
          type: string
          example: Хорошая площадка
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - spot_id
        - rating
        - text
    NewReview:
      type: object
      required:
        - spot_id
        - rating
        - text
      properties:
        spot_id:
          type: string
          example: osm:node:12345
        rating:
          type: integer
          example: 5
          minimum: 1
          maximum: 5
        text:
          type: string
          example: Хорошая площадка
      additionalProperties: false
      description: user_id назначается базой по auth.uid() и не передаётся клиентом.
    UpdateReview:
      type: object
      minProperties: 1
      properties:
        rating:
          type: integer
          example: 4
          minimum: 1
          maximum: 5
        text:
          type: string
          example: Хорошая площадка, но слабое освещение
      additionalProperties: false
    Favorite:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        spot_id:
          type: string
          example: osm:node:12345
        created_at:
          type: string
          example: '2026-11-02T10:00:00Z'
          format: date-time
      required:
        - spot_id
    NewFavorite:
      type: object
      properties:
        spot_id:
          type: string
          example: osm:node:12345
      required:
        - spot_id
      additionalProperties: false
      description: user_id берётся из auth.uid()
    SpotProposal:
      type: object
      properties:
        id:
          type: string
          example: 33333333-3333-4333-8333-333333333333
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
          example: Баскетбольная площадка
        sport_type:
          type: string
          example: basketball
        latitude:
          type: number
          example: 56.32
          minimum: -90
          maximum: 90
        longitude:
          type: number
          example: 44.0
          minimum: -180
          maximum: 180
        address:
          type: string
          nullable: true
        surface:
          type: string
          nullable: true
        lighting:
          type: boolean
          nullable: true
        equipment:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        status:
          type: string
          example: pending
          enum:
            - pending
            - approved
            - rejected
        reject_reason:
          type: string
          nullable: true
        moderator_id:
          type: string
          format: uuid
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - sport_type
        - latitude
        - longitude
        - status
    NewSpotProposal:
      type: object
      required:
        - name
        - sport_type
        - latitude
        - longitude
      additionalProperties: false
      properties:
        name:
          type: string
          example: Баскетбольная площадка
          minLength: 1
        sport_type:
          type: string
          example: basketball
        latitude:
          type: number
          example: 56.32
          minimum: -90
          maximum: 90
        longitude:
          type: number
          example: 44.0
          minimum: -180
          maximum: 180
        address:
          type: string
          nullable: true
        surface:
          type: string
          nullable: true
        lighting:
          type: boolean
          nullable: true
        equipment:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
      description: user_id берётся из auth.uid(), status по умолчанию pending; клиент не может указывать решение
        модератора.
    ModerationRequest:
      type: object
      required:
        - proposal_id
        - decision
      additionalProperties: false
      properties:
        proposal_id:
          type: string
          example: 33333333-3333-4333-8333-333333333333
          format: uuid
        decision:
          type: string
          example: approved
          enum:
            - approved
            - rejected
        reason:
          type: string
          description: Обязателен для rejected; проверяется в Edge Function.
    ModerationResponse:
      type: object
      required:
        - proposal_id
        - status
      properties:
        proposal_id:
          type: string
          example: 33333333-3333-4333-8333-333333333333
          format: uuid
        status:
          type: string
          example: approved
          enum:
            - approved
            - rejected
        spot_id:
          type: string
          description: Присутствует только после одобрения
          example: community:44444444-4444-4444-8444-444444444444
          nullable: true
        reject_reason:
          type: string
          nullable: true
    SpotSearchResult:
      type: object
      required:
        - data
        - page
        - limit
        - has_more
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Spot'
        page:
          type: integer
          example: 1
          minimum: 1
        limit:
          type: integer
          example: 20
          minimum: 1
          maximum: 100
        has_more:
          type: boolean
          example: false
    RestError:
      type: object
      properties:
        code:
          type: string
          example: '23505'
        message:
          type: string
          example: duplicate key value violates unique constraint
        details:
          type: string
          nullable: true
        hint:
          type: string
          nullable: true
      required:
        - code
        - message
    FunctionError:
      type: object
      properties:
        code:
          type: string
          example: INVALID_COORDINATES
        message:
          type: string
          example: Некорректные координаты
      required:
        - code
        - message
